<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Forensic DDoS Detection</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1d3a 50%, #2d1b4e 100%);
            position: relative;
            color: #d0d0e8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 40px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(100, 200, 255, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.08) 0%, rgba(100, 150, 255, 0.04) 100%);
            padding: 40px;
            border-radius: 16px;
            width: 480px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(0, 212, 255, 0.25);
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .container:hover {
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 12px 40px rgba(0, 212, 255, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
            font-size: 1.8em;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #a0a0c0;
            font-size: 0.95em;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(0, 212, 255, 0.2);
            margin-bottom: 20px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: #d0d0e8;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        select:focus,
        input:focus {
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            outline: none;
        }

        .timestamp {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(100, 150, 255, 0.05) 100%);
            border: 2px solid rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            font-weight: bold;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        button,
        .btn-analysis {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2) 0%, rgba(100, 150, 255, 0.1) 100%);
            border: 2px solid rgba(0, 212, 255, 0.4);
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.1);
        }

        button:hover,
        .btn-analysis:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.3) 0%, rgba(100, 150, 255, 0.2) 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
            border-color: rgba(0, 212, 255, 0.6);
        }

        .btn-analysis {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.2) 0%, rgba(56, 142, 60, 0.1) 100%);
            border-color: rgba(76, 175, 80, 0.4);
            color: #66dd66;
        }

        .btn-analysis:hover {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.3) 0%, rgba(56, 142, 60, 0.2) 100%);
            border-color: rgba(76, 175, 80, 0.6);
            color: #66dd66;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
        }

        .result {
            margin-top: 25px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 2px solid;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .normal {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.15) 0%, rgba(56, 142, 60, 0.08) 100%);
            color: #66dd66;
            border-color: rgba(76, 175, 80, 0.4);
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.2);
        }

        .attack {
            background: linear-gradient(135deg, rgba(244, 67, 54, 0.15) 0%, rgba(211, 47, 47, 0.08) 100%);
            color: #ff9999;
            border-color: rgba(244, 67, 54, 0.4);
            box-shadow: 0 4px 20px rgba(244, 67, 54, 0.2);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                box-shadow: 0 4px 15px rgba(0, 212, 255, 0.1);
            }
            50% {
                box-shadow: 0 4px 25px rgba(0, 212, 255, 0.3);
            }
        }

        .container {
            animation: fadeInUp 0.8s ease-out;
        }

        button:hover, .btn-analysis:hover {
            animation: glowPulse 2s ease-in-out;
        }

        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Cyber Forensic DDoS Detection</h2>

    <form method="post">
        {% csrf_token %}

        <label>Timestamp (System)</label>
        <input type="text" id="timestamp" class="timestamp" readonly>

        <label>Activity Type</label>
        <select name="activity" required>
            {% for a in activities %}
                <option value="{{ a }}">{{ a }}</option>
            {% endfor %}
        </select>

        <label>Action</label>
        <select name="action" required>
            {% for a in actions %}
                <option value="{{ a }}">{{ a }}</option>
            {% endfor %}
        </select>

        <label>Login Attempts</label>
        <input type="number" name="login_attempts" min="0" required autocomplete="off">

        <label>File Size (KB)</label>
        <input type="number" step="0.1" name="file_size" min="0" required autocomplete="off">

        <label>Anomaly Type</label>
        <select name="anomaly" required>
            {% for a in anomalies %}
                <option value="{{ a }}">{{ a }}</option>
            {% endfor %}
        </select>

        <div class="button-group">
            <button type="submit">Detect Attack</button>
            <a href="/analysis/" class="btn-analysis">📊 Analysis</a>
        </div>
    </form>

    {% if result %}
        <div class="result {% if 'Normal' in result %}normal{% else %}attack{% endif %}">
            {{ result }}
            {% if confidence %}
                <p style="margin-top: 10px; font-size: 14px;">Confidence: <strong>{{ confidence }}%</strong></p>
            {% endif %}
        </div>
    {% endif %}
</div>

<script>
    function updateTimestamp() {
        const now = new Date();
        document.getElementById("timestamp").value =
            now.toLocaleDateString() + " " + now.toLocaleTimeString();
    }
    updateTimestamp();

    // Clear form after submission
    const form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', function() {
            setTimeout(() => {
                form.reset();
                updateTimestamp();
            }, 100);
        });
    }
</script>

</body>
</html>
